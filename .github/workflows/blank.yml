name: Random cat

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scarica un gatto nuovo
        run: |
          mkdir -p assets
          curl -fsSL --retry 3 "https://cataas.com/cat/cute?width=440&height=440" -o assets/cat.jpg

      - name: Aggiorna il parametro nel README
        run: |
          sed -i -E "s#(assets/cat\.jpg)\?v=[0-9]+#\1?v=$(date +%s)#" README.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cat.jpg README.md
          git diff --cached --quiet || git commit -m "Update random cat"
          git push
